<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JZ BASEBALL TEAM - 攻守名單 V44</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700;400&display=swap');

        body { font-family: '微軟正黑體', Arial, sans-serif; background: #111; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; color: #fff; }

        #capture-area {
            width: 756px; height: auto; 
            background-color: #0c0814;
            background-image: radial-gradient(circle at 50% 30%, #1a103c 0%, #0c0814 80%);
            display: flex; position: relative; overflow: visible;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container { width: 100%; display: flex; flex-direction: column; position: relative; z-index: 2; }

        /* 表頭 LOGO 去背與加大 */
        .header-container {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.15); padding-bottom: 12px;
        }
        .header-logo { 
            width: 60px; height: 60px; object-fit: contain; 
            mix-blend-mode: screen; 
            filter: brightness(1.2); 
        }
        .header-title { 
            font-family: 'Oswald', sans-serif; font-size: 18pt; font-weight: bold; color: #fff; 
            letter-spacing: 3px; text-shadow: 0 0 10px rgba(179,136,255,0.5);
        }

        /* 資訊列：背景寬度加大包覆 */
        .game-info-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); 
            gap: 12px; margin-bottom: 15px; 
            background: rgba(0,0,0,0.4); padding: 16px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .info-cell { display: flex; align-items: center; gap: 6px; font-size: 18pt; color: #ddd; min-height: 40px; }
        .info-cell span { font-weight: bold; color: #B89947; white-space: nowrap; font-size: 18pt; }
        
        .game-info-grid input, .game-info-grid select { 
            background: transparent; border: none; color: #fff; font-size: 18pt; font-weight: bold; outline: none; cursor: pointer; width: 100%;
            border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 3px;
            line-height: 1.4;
        }
        select option { background: #fff; color: #000; font-size: 14pt; }

        /* 日曆與時鐘圖示深紫色 */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(18%) sepia(85% saturate(600%) hue-rotate(255deg));
            cursor: pointer; opacity: 1;
        }

        /* 左右區域分配 */
        .roster-split { display: flex; gap: 15px; width: 100%; }
        .starters-col { width: 62%; display: flex; flex-direction: column; }
        .bench-col { width: 38%; display: flex; flex-direction: column; }

        .lineup-list { display: flex; flex-direction: column; gap: 6px; }
        
        /* 🌟 改用 Flexbox 彈性排開，徹底防止寬度打架跑版 🌟 */
        .lineup-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: rgba(255,255,255,0.04); padding: 4px 10px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            box-sizing: border-box;
            width: 100%;
        } 
        
        /* 統一字體為 18pt */
        .order-num { 
            background: #4A148C; color: #fff; font-family: 'Oswald', sans-serif; 
            font-size: 18pt; font-style: italic; 
            width: 55px; height: 38px; flex-shrink: 0;
            display: flex; justify-content: center; align-items: center; 
            border-radius: 4px;
        }

        .pos-select {
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #B89947; font-family: 'Oswald', sans-serif; font-size: 18pt; font-weight: bold;
            width: 85px; height: 38px; border-radius: 4px; text-align: center; cursor: pointer; outline: none;
            flex-shrink: 0;
        }

        .player-select { 
            -webkit-appearance: none; appearance: none; 
            background: transparent; border: none; 
            color: #fff; font-size: 18pt; font-weight: bold; outline: none; 
            height: 38px; line-height: 38px;
            padding: 0; text-shadow: 1px 1px 2px #000;
            cursor: pointer;
            flex: 1; /* 自動填滿姓名空間 */
            min-width: 0;
        }
        /* 確保下拉選單字體清晰可見 */
        .player-select option, .pos-select option { background: #fff; color: #000; font-size: 14pt; }

        .jersey-num { 
            font-family: 'Oswald', sans-serif; font-size: 18pt; 
            color: #B388FF; font-style: italic; 
            opacity: 0; transition: 0.3s; 
            width: 50px; text-align: center; flex-shrink: 0;
        }
        .jersey-num.active { opacity: 1; }

        /* 預備球員 Flex 結構 */
        .reserve-row { 
            display: flex; 
            align-items: center; gap: 10px; 
            background: rgba(255,255,255,0.04); padding: 4px 10px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08); margin-bottom: 6px;
            box-sizing: border-box;
            width: 100%;
        }
        .reserve-row .order-num { font-size: 16pt; font-style: normal; background: #333; color: #aaa; width: 45px; height: 38px; }
        .reserve-row .player-select { flex: 1; }
        .reserve-row .jersey-num { width: 50px; }

        .bottom-action-area { display: flex; gap: 15px; margin-top: 15px; justify-content: center; width: 100%; }
        button { font-size: 16pt; padding: 10px 25px; font-weight: bold; color: #fff; border: none; border-radius: 8px; cursor: pointer; background: #4A148C; transition: 0.3s; }
        #share-line-btn { background: #06C755; }
    </style>
</head>
<body>

<div id="capture-area">
    <div class="main-container">
        <div class="header-container">
            <img class="header-logo" src="https://lh3.googleusercontent.com/d/1aooCsOuMMtwMhT5bay4kDQCAq9sbm3kW" crossorigin="anonymous">
            <div class="header-title">🔥 攻 守 名 單 🔥</div>
        </div>
        
        <div class="game-info-grid">
            <div class="info-cell"><span>日期：</span><input type="date" id="game-date"></div>
            <div class="info-cell"><span>集合：</span><input type="time" value="08:00"></div>
            <div class="info-cell"><span>比賽：</span><input type="time" value="09:00"></div>
            
            <div class="info-cell"><span>地點：</span><select id="game-location"><option value="">選擇...</option></select></div>
            <div class="info-cell">

                <select id="bench-side">

            </div>
            <div class="info-cell"><span>對戰：</span><input type="text" placeholder="對手名稱..."></div>
        </div>

        <div class="roster-split">
            <div class="starters-col">
                <div class="lineup-list" id="starters-board"></div>
                <div class="lineup-list" style="margin-top: 6px;">
                    <div class="lineup-row" id="sp-row">

                        <select class="player-select"><option value="">-- 球員 --</option></select>
                        <div class="jersey-num"></div>
                    </div>
                </div>
            </div>
            <div class="bench-col">
                <div id="reserves-board"></div>
            </div>
        </div>

        <div class="bottom-action-area">
            <button id="export-btn">📸 下載圖檔</button>
            <button id="share-line-btn">🟢 分享至 LINE</button>
        </div>
    </div>
</div>
