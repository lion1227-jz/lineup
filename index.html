<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JZ BASEBALL TEAM - 攻守名單 V36</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700;400&display=swap');

        * { box-sizing: border-box; }

        body { font-family: '微軟正黑體', Arial, sans-serif; background: #111; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; min-height: 100vh; color: #fff; }

        #capture-area {
            width: 820px; height: auto; 
            background-color: #0c0814;
            background-image: radial-gradient(circle at 50% 30%, #1a103c 0%, #0c0814 80%);
            display: flex; position: relative; overflow: visible;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            padding: 25px;
        }

        .main-container { width: 100%; display: flex; flex-direction: column; position: relative; z-index: 2; }

        /* 表頭 LOGO 區 */
        .header-container {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.15); padding-bottom: 12px;
        }
        .header-logo { 
            width: 65px; height: 65px; object-fit: contain; 
            filter: brightness(1.1); 
        }
        .header-title { 
            font-family: 'Oswald', sans-serif; font-size: 38px; font-weight: bold; color: #fff; 
            letter-spacing: 3px; text-shadow: 0 0 10px rgba(179,136,255,0.5);
        }

        /* 比賽資訊區 */
        .game-info-grid { 
            display: grid; grid-template-columns: 1fr 1fr 1fr; 
            gap: 15px; margin-bottom: 20px; 
            background: rgba(0,0,0,0.4); padding: 18px 15px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .info-cell { display: flex; align-items: center; gap: 6px; font-size: 18px; color: #ddd; }
        .info-cell span { font-weight: bold; color: #B89947; white-space: nowrap; font-size: 18px; }
        
        .game-info-grid input, .game-info-grid select { 
            background: transparent; border: none; color: #fff; font-size: 18px; font-weight: bold; outline: none; cursor: pointer; width: 100%;
            border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 3px;
        }
        select option { background: #fff; color: #000; font-size: 14pt; }

        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(18%) sepia(85% saturate(600%) hue-rotate(255deg));
            cursor: pointer; opacity: 1;
        }

        .roster-split { display: flex; gap: 20px; width: 100%; }
        .starters-col { width: 62%; display: flex; flex-direction: column; }
        .bench-col { width: 38%; display: flex; flex-direction: column; }

        .lineup-list { display: flex; flex-direction: column; gap: 8px; }
        
        /* 重新調配網格寬度：棒次(55px) | 守位(68px) | 姓名(165px) | 背號(42px) ➔ 完美分開不重疊 */
        .lineup-row { 
            display: grid; 
            grid-template-columns: 55px 68px 165px 42px; 
            align-items: center; gap: 12px; 
            background: rgba(255,255,255,0.04); padding: 5px 12px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
        } 
        
        .order-num { 
            background: #4A148C; color: #fff; font-family: 'Oswald', sans-serif; 
            font-size: 20px; font-style: italic; 
            height: 38px; 
            display: flex; justify-content: center; align-items: center; 
            border-radius: 4px;
        }

        .pos-select {
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #B89947; font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: bold;
            width: 100%; height: 34px; border-radius: 4px; text-align: center; cursor: pointer; outline: none;
        }

        /* 球員姓名：足夠容納 8 個字寬度 */
        .player-select { 
            -webkit-appearance: none; appearance: none; 
            background: transparent; border: none; 
            color: #fff; font-size: 22px; font-weight: bold; outline: none; 
            width: 165px; height: 36px; line-height: 36px;
            padding: 0; text-shadow: 1px 1px 2px #000;
            cursor: pointer;
        }

        /* 背號樣式：金色字體 + 紫色圓形背景，無 # 字 */
        .jersey-num { 
            font-family: 'Oswald', sans-serif; font-size: 19px; font-weight: bold;
            color: #ffd700; 
            background: #4A148C; 
            border: 1px solid rgba(255, 215, 0, 0.3);
            width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            margin-left: 5px;
        }
        .jersey-num.active { opacity: 1; }

        /* 預備球員單列 */
        .reserve-row { 
            display: grid; 
            grid-template-columns: 45px 165px 42px; 
            align-items: center; gap: 12px; 
            background: rgba(255,255,255,0.04); padding: 5px 12px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px;
        }
        .reserve-row .order-num { font-size: 16px; font-style: normal; background: #333; color: #aaa; }
        .reserve-row .player-select { font-size: 22px; }

        .bottom-action-area { display: flex; gap: 15px; margin-top: 20px; justify-content: center; width: 100%; }
        button { font-size: 16px; padding: 10px 25px; font-weight: bold; color: #fff; border: none; border-radius: 8px; cursor: pointer; background: #4A148C; transition: 0.3s; }
        #share-line-btn { background: #06C755; }
    </style>
</head>
<body>

<div id="capture-area">
    <div class="main-container">
        <div class="header-container">
            <img class="header-logo" src="https://lh3.googleusercontent.com/d/1aooCsOuMMtwMhT5bay4kDQCAq9sbm3kW" crossorigin="anonymous">
            <div class="header-title">🔥 攻守名單 🔥</div>
        </div>
        
        <div class="game-info-grid">
            <div class="info-cell"><span>日期：</span><input type="date" id="game-date"></div>
            <div class="info-cell"><span>集合：</span><input type="time" value="08:00"></div>
            <div class="info-cell"><span>比賽：</span><input type="time" value="09:00"></div>
            
            <div class="info-cell"><span>地點：</span><select id="game-location"><option value="">選擇...</option></select></div>
            <div class="info-cell">
                <span>休息區：</span>
                <select id="bench-side">
                    <option value="">選擇...</option>
                    <option value="一壘側(先攻)">一壘側(先攻)</option>
                    <option value="三壘側(先守)">三壘側(先守)</option>
                </select>
            </div>
            <div class="info-cell"><span>對戰：</span><input type="text" placeholder="對手名稱..."></div>
        </div>

        <div class="roster-split">
            <div class="starters-col">
                <div class="lineup-list" id="starters-board"></div>
                <div class="lineup-list" style="margin-top: 8px;">
                    <div class="lineup-row" id="sp-row">
                        <div class="order-num" style="background:#311B92;">P</div>
                        <select class="pos-select" disabled><option>P (1)</option></select>
                        <select class="player-select"><option value="">-- 球員 --</option></select>
                        <div class="jersey-num"></div>
                    </div>
                </div>
            </div>
            
            <div class="bench-col">
                <div id="reserves-board"></div>
            </div>
        </div>

        <div class="bottom-action-area">
            <button id="export-btn">📸 下載圖檔</button>
            <button id="share-line-btn">🟢 分享至 LINE</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('game-date').value = new Date().toISOString().split('T')[0];
    const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQE8qU7MUo8mltMrnQSLttK1ePGuN2ooTaD3QBtoKsmvrW5tEKOjSXwGm9bwhZtgy2veLF-QLTpe33q/pub?output=csv";
    let playersData = [];
    const posList = ["C (2)", "1B (3)", "2B (4)", "3B (5)", "SS (6)", "LF (7)", "CF (8)", "RF (9)", "DH"];

    function createRow(index, type, container) {
        const row = document.createElement('div');
        row.className = type === 'reserve' ? 'reserve-row' : 'lineup-row';
        if (type === 'starter') {
            row.innerHTML = `
                <div class="order-num">${index}棒</div>
                <select class="pos-select">
                    <option value="">守位</option>
                    ${posList.map(p => `<option value="${p}">${p}</option>`).join('')}
                </select>
                <select class="player-select"><option value="">-- 球員 --</option></select>
                <div class="jersey-num"></div>`;
        } else {
            row.innerHTML = `
                <div class="order-num">預</div>
                <select class="player-select"><option value="">-- 球員 --</option></select>
                <div class="jersey-num"></div>`;
        }

        const pSelect = row.querySelector('.player-select');
        const jerseyNum = row.querySelector('.jersey-num');
        pSelect.addEventListener('change', () => {
            const p = playersData.find(x => x.name === pSelect.value);
            if (p && p.num) { jerseyNum.textContent = p.num; jerseyNum.classList.add('active'); }
            else { jerseyNum.textContent = ''; jerseyNum.classList.remove('active'); }
        });
        container.appendChild(row);
    }

    for (let i = 1; i <= 9; i++) createRow(i, 'starter', document.getElementById('starters-board'));
    for (let i = 1; i <= 8; i++) createRow(i, 'reserve', document.getElementById('reserves-board'));

    const pSel = document.querySelector('#sp-row .player-select');
    const pJersey = document.querySelector('#sp-row .jersey-num');
    pSel.addEventListener('change', () => {
        const p = playersData.find(x => x.name === pSel.value);
        if (p && p.num) { pJersey.textContent = p.num; pJersey.classList.add('active'); }
        else { pJersey.textContent = ''; pJersey.classList.remove('active'); }
    });

    Papa.parse(GOOGLE_SHEET_URL, {
        download: true,
        complete: function(results) {
            const data = results.data.slice(1);
            playersData = data.map(row => ({ num: String(row[0]||"").trim(), name: String(row[1]||"").trim() })).filter(p => p.name !== "");
            const locations = Array.from(new Set(data.map(row => String(row[2]||"").trim()))).filter(loc => loc !== "");
            document.getElementById('game-location').innerHTML = '<option value="">選擇...</option>' + locations.map(loc => `<option value="${loc}">${loc}</option>`).join('');
            document.querySelectorAll('.player-select').forEach(select => {
                playersData.forEach(p => { const opt = document.createElement('option'); opt.value = p.name; opt.textContent = p.name; select.appendChild(opt); });
            });
        }
    });

    async function handleShare() {
        const btns = document.querySelector('.bottom-action-area');
        btns.style.display = 'none';
        const canvas = await html2canvas(document.getElementById('capture-area'), { scale: 2, useCORS: true });
        btns.style.display = 'flex';
        canvas.toBlob(blob => {
            const file = new File([blob], 'JZ_Lineup.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file] });
            else { const link = document.createElement('a'); link.download = 'JZ_Lineup.png'; link.href = URL.click ? URL.createObjectURL(blob) : ''; link.click(); }
        });
    }
    document.getElementById('export-btn').onclick = handleShare;
    document.getElementById('share-line-btn').onclick = handleShare;
</script>
</body>
</html>
